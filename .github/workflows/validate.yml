name: Validate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions: read-all

jobs:
  build:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: code
        uses: actions/checkout@v4

      - name: go
        uses: actions/setup-go@v7
        with:
          go-version: ^1.27

      - name: install
        run: go install github.com/ndx-technologies/product-category-go/cmd/product-category@latest

      - name: validate
        run: product-category validate

      - name: stats
        if: always()
        run: product-category stats
